[package]
name         = "horizon-core"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/horizon-next"
description  = "Shared schema home for the Horizon concept — declares Magnitude, the cross-crate trust noun."
publish      = false
links        = "horizon-core"
build        = "build.rs"

[lib]
name = "horizon_core"
path = "src/lib.rs"

[dependencies]
nota-next = { workspace = true }
rkyv      = { workspace = true }

[build-dependencies]
schema-next      = { workspace = true }
schema-rust-next = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
